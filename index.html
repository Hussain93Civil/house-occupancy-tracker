<!DOCTYPE html>
<html>
<head>
    <title>House Occupancy Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            padding: 20px;
        }
        #status {
            font-size: 24px;
            padding: 20px;
            margin: 20px auto;
            width: 250px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .vacant {
            background-color: #4CAF50; /* Green */
            color: white;
        }
        .occupied {
            background-color: #f44336; /* Red */
            color: white;
        }
        .btn {
            padding: 15px 30px;
            margin: 20px 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            min-width: 150px;
        }
        #enterBtn {
            background-color: #2196F3;
            color: white;
        }
        #exitBtn {
            background-color: #FF9800;
            color: white;
        }
        .hidden {
            display: none;
        }
        #userSelect {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            width: 200px;
        }
        #lastUpdated {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>House Occupancy Tracker</h1>
    
    <div id="status" class="vacant">VACANT</div>
    
    <select id="userSelect">
        <option value="">Select User</option>
        <option value="User 1">User 1</option>
        <option value="User 2">User 2</option>
        <option value="User 3">User 3</option>
        <option value="User 4">User 4</option>
    </select>
    
    <div>
        <button id="enterBtn" class="btn" onclick="enterHouse()">Enter House</button>
        <button id="exitBtn" class="btn hidden" onclick="exitHouse()">Exit House</button>
    </div>
    
    <div id="lastUpdated"></div>

    <script>
        // DOM elements
        const statusDiv = document.getElementById('status');
        const userSelect = document.getElementById('userSelect');
        const enterBtn = document.getElementById('enterBtn');
        const exitBtn = document.getElementById('exitBtn');
        const lastUpdatedDiv = document.getElementById('lastUpdated');
        
        // State variables
        let currentUser = null;
        let isOccupied = false;
        
        function updateUI() {
            // Update last updated time
            lastUpdatedDiv.textContent = `Last updated: ${new Date().toLocaleString()}`;
        }
        
        function enterHouse() {
            const user = userSelect.value;
            
            if (!user) {
                alert('Please select a user first');
                return;
            }
            
            if (isOccupied) {
                alert(`House is already occupied by ${currentUser}`);
                return;
            }
            
            currentUser = user;
            isOccupied = true;
            statusDiv.className = 'occupied';
            statusDiv.textContent = `OCCUPIED by ${user}`;
            enterBtn.classList.add('hidden');
            exitBtn.classList.remove('hidden');
            userSelect.disabled = true;
            updateUI();
        }
        
        function exitHouse() {
            if (!isOccupied) {
                alert('House is already vacant');
                return;
            }
            
            currentUser = null;
            isOccupied = false;
            statusDiv.className = 'vacant';
            statusDiv.textContent = 'VACANT';
            enterBtn.classList.remove('hidden');
            exitBtn.classList.add('hidden');
            userSelect.disabled = false;
            updateUI();
        }
        
        // Initialize the UI
        updateUI();
    </script>
</body>
</html>
